<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Bazar - EL BUENO</title><style>body{font-family:Arial;padding:15px;background:#f5f5f5} .card{background:#fff;padding:15px;border-radius:12px;margin-bottom:15px} input,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box} button{padding:12px;border:none;border-radius:8px;font-weight:900} .rosa{background:#ff0066;color:#fff} .negro{background:#000;color:#fff;width:100%;font-size:18px}</style></head><body>
<h1>Admin Bazar - EL BUENO</h1>
<div class="card"><h2>Banner Inteligente</h2><input id="b-titulo" placeholder="Titulo"><input id="b-link" placeholder="Link"><input id="b-file" type="file" multiple accept="image/*"><button class="rosa" onclick="subirBanner()">Subir Banner</button><div id="banners-lista"></div></div>
<div class="card"><h2>Producto N Fotos + Video</h2><input id="p-nombre" placeholder="Nombre"><input id="p-precio" type="number" placeholder="Precio"><textarea id="p-desc" placeholder="Desc"></textarea><label><b>📸 FOTOS (N fotos, 1ra=portada):</b></label><input id="p-fotos" type="file" multiple accept="image/*" style="background:#facc15"><div id="prev-fotos" style="display:flex;gap:5px;overflow:auto"></div><label><b>🎥 VIDEO (al final):</b></label><input id="p-video" type="file" accept="video/*" style="background:#000;color:#fff"><div id="prev-video"></div><button class="negro" onclick="subirProducto()">Subir Producto</button></div>
<div class="card"><h2>Productos - Borrar</h2><div id="productos-lista"></div></div>
<script>
let fotos=[],video=null;
function toB64(f){return new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);})}
document.getElementById('p-fotos')?.addEventListener('change',async e=>{fotos=[];let c=document.getElementById('prev-fotos');c.innerHTML='';for(let f of e.target.files){let b=await toB64(f);fotos.push(b);c.innerHTML+=`<img src="${b}" style="width:60px;height:60px;object-fit:cover;border-radius:8px">`}})
document.getElementById('p-video')?.addEventListener('change',async e=>{if(e.target.files[0]) video=await toB64(e.target.files[0])})
async function subirProducto(){let data={nombre:document.getElementById('p-nombre').value,precio:document.getElementById('p-precio').value,desc:document.getElementById('p-desc').value,fotos,video,imagen:fotos[0]};let r=await fetch('/api/productos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(r.ok){alert('Producto subido '+fotos.length+' fotos');location.reload()}else alert('Error')}
async function subirBanner(){let f=document.getElementById('b-file').files[0];if(!f)return alert('Elige foto');let b=await toB64(f);let r=await fetch('/api/banners',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({titulo:document.getElementById('b-titulo').value,link:document.getElementById('b-link').value,imagen:b})});if(r.ok){alert('Banner');location.reload()}}
async function cargar(){let r=await fetch('/api/productos');let ps=await r.json();let h='';ps.forEach(p=>{h+=`<div style="display:flex;gap:8px;border:1px solid #ddd;padding:8px;margin:5px 0;border-radius:8px"><img src="${(p.fotos&&p.fotos[0])||p.imagen||''}" style="width:50px;height:50px;object-fit:cover"><div style="flex:1"><b>${p.nombre}</b> $${p.precio}</div><button onclick="borrar('${p._id||p.id}')" style="background:red;color:#fff">X</button></div>`});document.getElementById('productos-lista').innerHTML=h}
async function borrar(id){if(!confirm('Borrar?'))return;await fetch('/api/productos/'+id,{method:'DELETE'});cargar()}cargar();
</script></body></html>
