<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Bazar Los Cuates</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}body{background:#f6f6f6}.header{background:#111;color:#fff;padding:15px 20px;display:flex;justify-content:space-between}.card{background:#fff;padding:16px;margin:12px;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}input,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px}button{background:#111;color:#fff;padding:12px;width:100%;border:none;border-radius:10px;font-weight:700} .item{display:flex;gap:8px;align-items:center;border:1px solid #eee;padding:8px;border-radius:10px;margin:5px 0} .item img{width:50px;height:50px;object-fit:cover;border-radius:8px}</style></head><body>
<div class="header"><b>BAZAR LOS CUATES</b><span id="out" style="display:none" onclick="localStorage.clear();location.reload()">Salir</span></div>
<div id="login"><div class="card" style="max-width:360px;margin:60px auto"><h2>Admin</h2><input id="u" placeholder="Usuario" autocomplete="off"><input id="p" type="password" placeholder="Contraseña" autocomplete="off"><button onclick="go()">Entrar</button><p id="m" style="color:red"></p></div></div>
<div id="dash" style="display:none"><div class="card"><h3>Banners - Activos</h3><input id="bt" placeholder="Titulo"><input id="bl" placeholder="Link"><input id="bf" type="file" accept="image/*"><button onclick="sb()">Guardar Banner</button><div id="bs"></div></div><div class="card"><h3>Producto Nuevo</h3><input id="pn" placeholder="Nombre"><input id="pp" type="number" placeholder="Precio"><textarea id="pd" placeholder="Descripcion"></textarea><input id="pf" type="file" multiple accept="image/*"><div id="prev" style="display:flex;gap:6px;flex-wrap:wrap"></div><input id="pv" type="file" accept="video/*"><button onclick="sp()">Publicar Producto</button></div><div class="card"><h3>Lista Productos - (X para borrar)</h3><div id="prods"></div></div></div>
<script>
function go(){if(u.value.trim()=='admin'&&p.value.trim()=='cuates'){localStorage.setItem('a','1');login.style.display='none';dash.style.display='block';out.style.display='block';load()}else m.innerText='Usuario o contraseña mal'}
if(localStorage.getItem('a')){login.style.display='none';dash.style.display='block';out.style.display='block'}
let fotos=[],vid=null;function b64(f){return new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)})}
pf.addEventListener('change',async e=>{fotos=[];prev.innerHTML='';for(let f of e.target.files){let b=await b64(f);fotos.push(b);prev.innerHTML+=`<img src="${b}" style="width:55px;height:55px;object-fit:cover;border-radius:8px">`}});
pv.addEventListener('change',async e=>{if(e.target.files[0])vid=await b64(e.target.files[0])});
async function sp(){if(!fotos.length)return alert('Pon al menos 1 foto');let d={nombre:pn.value,precio:pp.value,desc:pd.value,fotos,video:vid,imagen:fotos[0]};let r=await fetch('/api/productos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(r.ok){alert('Producto publicado');pn.value='';pp.value='';pd.value='';load()}else alert('Error')}
async function sb(){let file=bf.files[0];if(!file)return alert('Elige foto');let img=await b64(file);let r=await fetch('/api/banners',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({titulo:bt.value,link:bl.value,imagen:img})});if(r.ok){alert('Banner guardado');bt.value='';bl.value='';load()}else alert('Error')}
async function load(){try{let rp=await fetch('/api/productos');let pr=await rp.json();let h='';if(!pr.length)h='<p style=color:#888>No hay productos</p>';pr.slice().reverse().forEach(x=>{h+=`<div class=item><img src="${(x.fotos&&x.fotos[0])||x.imagen||''}"><div style="flex:1"><b>${x.nombre}</b><br>$${x.precio}</div><button style="background:red;color:#fff;padding:6px 10px;border:none;border-radius:6px;width:auto" onclick="delP('${x._id||x.id}')">Borrar</button></div>`});prods.innerHTML=h;let rb=await fetch('/api/banners');let b=await rb.json();let hb='';if(!b.length)hb='<p style=color:#888>No hay banners</p>';b.slice().reverse().forEach(y=>{hb+=`<div class=item><img src="${y.imagen}"><div style="flex:1">${y.titulo||'Banner'}</div><button style="background:red;color:#fff;padding:6px 10px;border:none;border-radius:6px;width:auto" onclick="delB('${y._id||y.id}')">Borrar</button></div>`});bs.innerHTML=hb}catch(e){}}
async function delP(id){if(confirm('Borrar producto?')){await fetch('/api/productos/'+id,{method:'DELETE'});load()}}
async function delB(id){if(confirm('Borrar banner?')){await fetch('/api/banners/'+id,{method:'DELETE'});load()}}
if(localStorage.getItem('a'))load();
</script></body></html>
