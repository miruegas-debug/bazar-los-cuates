<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Bazar Los Cuates</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#f6f6f6}
.header{background:#111;color:#fff;padding:18px 22px;display:flex;justify-content:space-between}
.card{background:#fff;border-radius:14px;padding:18px;margin:16px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
input,textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin:7px 0;font-size:15px}
.btn-black{background:#111;color:#fff;width:100%;padding:13px;border-radius:10px;border:none;font-weight:800;font-size:16px;margin-top:8px}
#dashboard{display:none}
.product-item{display:flex;gap:10px;align-items:center;border:1px solid #eee;padding:10px;border-radius:12px;margin:6px 0}
.product-item img{width:62px;height:62px;object-fit:cover;border-radius:10px}
.btn-red{background:#ff2a2a;color:#fff;padding:8px 12px;border:none;border-radius:8px}
</style>
</head>
<body>
<div class="header"><b>BAZAR LOS CUATES</b><span id="salir" style="display:none" onclick="localStorage.clear();location.reload()">Salir</span></div>
<div id="login" style="max-width:380px;margin:60px auto"><div class="card">
<h2>Administrador</h2>
<input id="user" placeholder="Usuario" value="admin">
<input id="pass" type="password" placeholder="Contraseña" value="cuates">
<button class="btn-black" onclick="entrar()">Entrar</button>
<p id="msg" style="color:red;font-size:13px;margin-top:8px"></p>
</div></div>
<div id="dashboard">
<div class="card"><h2>📢 Banners</h2><input id="b-titulo" placeholder="Titulo"><input id="b-link" placeholder="Link"><input id="b-file" type="file" accept="image/*"><button class="btn-black" onclick="subirBanner()">Guardar Banner</button><div id="banners"></div></div>
<div class="card"><h2>🛍️ Producto</h2><input id="p-nombre" placeholder="Nombre"><input id="p-precio" type="number" placeholder="Precio"><textarea id="p-desc" placeholder="Desc"></textarea><input id="p-fotos" type="file" multiple accept="image/*"><div id="prev" style="display:flex;gap:5px;overflow:auto"></div><input id="p-video" type="file" accept="video/*"><button class="btn-black" onclick="subirProducto()">Publicar</button></div>
<div class="card"><h2>📦 Productos</h2><div id="productos"></div></div>
</div>
<script>
function entrar(){
  var u=document.getElementById('user').value.trim();
  var p=document.getElementById('pass').value.trim();
  if(u==='admin' && p==='cuates'){
    localStorage.setItem('bazar_admin','ok');
    document.getElementById('login').style.display='none';
    document.getElementById('dashboard').style.display='block';
    document.getElementById('salir').style.display='block';
    cargar();
  }else{
    document.getElementById('msg').innerText='Mal usuario o contra';
  }
}
if(localStorage.getItem('bazar_admin')==='ok'){
  document.getElementById('login').style.display='none';
  document.getElementById('dashboard').style.display='block';
  document.getElementById('salir').style.display='block';
}
let fotos=[], video=null;
function toB64(f){return new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);})}
var pf=document.getElementById('p-fotos');
if(pf) pf.addEventListener('change', async e=>{
  fotos=[]; var c=document.getElementById('prev'); c.innerHTML='';
  for(let f of e.target.files){ let b=await toB64(f); fotos.push(b); c.innerHTML+=`<img src="${b}" style="width:60px;height:60px;object-fit:cover;border-radius:8px">`; }
});
var pv=document.getElementById('p-video');
if(pv) pv.addEventListener('change', async e=>{ if(e.target.files[0]) video=await toB64(e.target.files[0]); });
async function subirProducto(){
  if(fotos.length===0) return alert('Pon 1 foto minimo');
  let data={nombre:document.getElementById('p-nombre').value, precio:document.getElementById('p-precio').value, desc:document.getElementById('p-desc').value, fotos, video, imagen:fotos[0]};
  let r=await fetch('/api/productos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  if(r.ok){ alert('Listo'); cargar(); } else alert('Error');
}
async function subirBanner(){
  let file=document.getElementById('b-file').files[0]; if(!file) return alert('Elige foto');
  let img=await toB64(file);
  let r=await fetch('/api/banners',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({titulo:document.getElementById('b-titulo').value, link:document.getElementById('b-link').value, imagen:img})});
  if(r.ok){ alert('Banner ok'); cargar(); }
}
async function cargar(){
  try{
    let rp=await fetch('/api/productos'); let prods=await rp.json();
    let h=''; prods.slice().reverse().forEach(p=>{ let foto=(p.fotos&&p.fotos[0])||p.imagen||''; h+=`<div class="product-item"><img src="${foto}"><div style="flex:1"><b>${p.nombre}</b><br>$${p.precio}</div><button class="btn-red" onclick="borrar('${p._id||p.id}')">Borrar</button></div>`; });
    document.getElementById('productos').innerHTML=h;
    let rb=await fetch('/api/banners'); let bs=await rb.json();
    let hb=''; bs.slice().reverse().forEach(b=>{ hb+=`<div class="product-item"><img src="${b.imagen}"><div style="flex:1">${b.titulo}</div><button class="btn-red" onclick="borrarB('${b._id||b.id}')">Borrar</button></div>`; });
    document.getElementById('banners').innerHTML=hb;
  }catch(e){}
}
async function borrar(id){ if(confirm('Borrar?')){ await fetch('/api/productos/'+id,{method:'DELETE'}); cargar(); } }
async function borrarB(id){ if(confirm('Borrar banner?')){ await fetch('/api/banners/'+id,{method:'DELETE'}); cargar(); } }
if(localStorage.getItem('bazar_admin')==='ok') cargar();
</script>
</body>
</html>
