<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Bazar Los Cuates</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif}
body{background:#f6f6f6}
.header{background:#111;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}
.header b{font-size:20px;letter-spacing:1px}
.card{background:#fff;border-radius:14px;padding:18px;margin:16px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
h2{font-size:18px;margin-bottom:12px}
input,textarea{width:100%;padding:13px 14px;border:1px solid #ddd;border-radius:10px;margin:7px 0;font-size:15px;background:#fafafa}
textarea{resize:vertical;min-height:80px}
.btn{padding:13px 18px;border-radius:10px;border:none;font-weight:800;cursor:pointer}
.btn-black{background:#111;color:#fff;width:100%;font-size:16px;margin-top:8px}
.btn-red{background:#ff2a2a;color:#fff;padding:8px 12px;border-radius:8px;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.product-item{display:flex;gap:10px;align-items:center;border:1px solid #eee;padding:10px;border-radius:12px;background:#fff}
.product-item img{width:62px;height:62px;object-fit:cover;border-radius:10px}
.badge{background:#111;color:#fff;font-size:11px;padding:4px 8px;border-radius:20px}
.login-wrap{max-width:380px;margin:70px auto}
.small{font-size:13px;color:#666;margin-top:6px}
#dashboard{display:none}
#prev{display:flex;gap:6px;overflow:auto;margin:8px 0}
#prev img{width:60px;height:60px;object-fit:cover;border-radius:8px;border:1px solid #ddd}
</style>
</head>
<body>
<div class="header"><b>BAZAR LOS CUATES</b><span id="logout" style="display:none;cursor:pointer" onclick="logout()">Salir ✕</span></div>

<div id="login" class="login-wrap">
<div class="card">
<h2>Administrador</h2>
<p class="small">La misma de antes, organizada</p>
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">
<button class="btn btn-black" onclick="entrar()">Entrar</button>
<p class="small">Tip: usuario <b>admin</b> / contraseña <b>cuates</b></p>
<p id="msg" class="small" style="color:red"></p>
</div>
</div>

<div id="dashboard">
<div class="card">
<h2>📢 Banners</h2>
<input id="b-titulo" placeholder="Título del banner (opcional)">
<input id="b-link" placeholder="Link al que va el banner">
<input id="b-file" type="file" accept="image/*">
<button class="btn btn-black" onclick="subirBanner()">Guardar Banner</button>
<div id="banners" style="margin-top:12px"></div>
</div>

<div class="card">
<h2>🛍️ Agregar Producto</h2>
<div class="grid">
<input id="p-nombre" placeholder="Nombre del producto">
<input id="p-precio" type="number" placeholder="Precio">
</div>
<textarea id="p-desc" placeholder="Descripción"></textarea>
<label class="small">Fotos del producto (la primera es la portada)</label>
<input id="p-fotos" type="file" multiple accept="image/*">
<div id="prev"></div>
<label class="small">Video opcional (se muestra al final)</label>
<input id="p-video" type="file" accept="video/*">
<button class="btn btn-black" onclick="subirProducto()">Publicar Producto</button>
</div>

<div class="card">
<h2>📦 Productos Actuales</h2>
<p class="small">Aquí ves lo que hay y puedes borrar</p>
<div id="productos"></div>
</div>
</div>

<script>
const USER_OK="admin", PASS_OK="cuates";
function entrar(){
  if(document.getElementById('user').value.trim()===USER_OK && document.getElementById('pass').value.trim()===PASS_OK){
    localStorage.setItem('bazar_admin','ok');
    mostrarDash();
  }else{ document.getElementById('msg').innerText="Usuario o contraseña mal"; }
}
function mostrarDash(){
  document.getElementById('login').style.display='none';
  document.getElementById('dashboard').style.display='block';
  document.getElementById('logout').style.display='block';
  cargar();
}
function logout(){ localStorage.removeItem('bazar_admin'); location.reload(); }
if(localStorage.getItem('bazar_admin')==='ok'){ mostrarDash(); }

let fotos=[], video=null;
function toB64(f){ return new Promise(r=>{ let fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(f); }); }
document.getElementById('p-fotos').addEventListener('change', async e=>{
  fotos=[]; let c=document.getElementById('prev'); c.innerHTML='';
  for(let f of e.target.files){ let b=await toB64(f); fotos.push(b); c.innerHTML+=`<img src="${b}">`; }
});
document.getElementById('p-video').addEventListener('change', async e=>{
  if(e.target.files[0]) video=await toB64(e.target.files[0]);
});

async function subirProducto(){
  let nombre=document.getElementById('p-nombre').value.trim();
  let precio=document.getElementById('p-precio').value.trim();
  if(!nombre||!precio||fotos.length===0) return alert('Pon nombre, precio y al menos 1 foto');
  let data={nombre, precio, desc:document.getElementById('p-desc').value, fotos, video, imagen:fotos[0]};
  let r=await fetch('/api/productos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  if(r.ok){ alert('Producto publicado'); document.getElementById('p-nombre').value=''; document.getElementById('p-precio').value=''; document.getElementById('p-desc').value=''; fotos=[]; video=null; document.getElementById('prev').innerHTML=''; cargar(); } else alert('Error');
}
async function subirBanner(){
  let file=document.getElementById('b-file').files[0];
  if(!file) return alert('Elige foto de banner');
  let img=await toB64(file);
  let data={titulo:document.getElementById('b-titulo').value, link:document.getElementById('b-link').value, imagen:img};
  let r=await fetch('/api/banners',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  if(r.ok){ alert('Banner guardado'); cargar(); } else alert('Error banner');
}
async function cargar(){
  try{
    let rp=await fetch('/api/productos'); let prods=await rp.json();
    let html=''; prods.slice().reverse().forEach(p=>{
      let foto=(p.fotos&&p.fotos[0])||p.imagen||'';
      html+=`<div class="product-item"><img src="${foto}"><div style="flex:1"><b>${p.nombre||'Sin nombre'}</b><br><span class="badge">$${p.precio||0}</span> <span class="small">${p.fotos? p.fotos.length+' fotos':''} ${p.video?' + video':''}</span></div><button class="btn-red" onclick="borrar('${p._id||p.id}')">Borrar</button></div>`;
    });
    document.getElementById('productos').innerHTML=html||'<p class="small">No hay productos</p>';
    let rb=await fetch('/api/banners'); let banners=await rb.json();
    let hb=''; banners.slice().reverse().forEach(b=>{
      hb+=`<div class="product-item"><img src="${b.imagen}"><div style="flex:1"><b>${b.titulo||'Banner'}</b></div><button class="btn-red" onclick="borrarBanner('${b._id||b.id}')">Borrar</button></div>`;
    });
    document.getElementById('banners').innerHTML=hb;
  }catch(e){ console.log(e); }
}
async function borrar(id){ if(!confirm('¿Borrar producto?')) return; await fetch('/api/productos/'+id,{method:'DELETE'}); cargar(); }
async function borrarBanner(id){ if(!confirm('¿Borrar banner?')) return; await fetch('/api/banners/'+id,{method:'DELETE'}); cargar(); }
</script>
</body>
</html>
