<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Admin</title><style>body{background:#f5f5f5;font-family:sans-serif}.h{background:#111;color:#fff;padding:14px;display:flex;justify-content:space-between}.c{background:#fff;margin:12px;padding:14px;border-radius:12px}input,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px}button{width:100%;padding:11px;background:#111;color:#fff;border:0;border-radius:8px;font-weight:700}</style></head><body><div class=h><b>BAZAR LOS CUATES</b><span id=o style=display:none onclick="localStorage.clear();location.reload()">Salir</span></div><div id=l><div class=c style="max-width:340px;margin:50px auto"><h2>Admin</h2><input id=u value=admin><input id=p type=password value=cuates><button onclick="go()">Entrar</button><p id=m style=color:red></p></div></div><div id=d style=display:none><div class=c><h3>Banner</h3><input id=bt placeholder=Titulo><input id=bl placeholder=Link><input id=bf type=file accept=image/*><button onclick="sb()">Guardar Banner</button><div id=bs></div></div><div class=c><h3>Producto</h3><input id=pn placeholder=Nombre><input id=pp type=number placeholder=Precio><textarea id=pd placeholder=Desc></textarea><input id=pf type=file multiple accept=image/*><div id=pr></div><input id=pv type=file accept=video/*><button onclick="sp()">Publicar</button></div><div class=c><h3>Lista</h3><div id=lp></div></div></div><script>function go(){if(u.value=='admin'&&p.value=='cuates'){localStorage.setItem('a',1);l.style.display='none';d.style.display='block';o.style.display='block';ld()}else m.innerText='mal'}if(localStorage.getItem('a')){l.style.display='none';d.style.display='block';o.style.display='block'}let F=[],V=null;const b64=f=>new Promise(r=>{let x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});pf.onchange=async e=>{F=[];pr.innerHTML='';for(let f of e.target.files){let b=await b64(f);F.push(b);pr.innerHTML+='<img src='+b+' style="width:50px;height:50px;object-fit:cover;border-radius:6px">'}};pv.onchange=async e=>{if(e.target.files[0])V=await b64(e.target.files[0])};async function sp(){if(!F.length)return alert('foto');let d={nombre:pn.value,precio:pp.value,desc:pd.value,fotos:F,video:V,imagen:F[0]};let r=await fetch('/api/productos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(r.ok){alert('ok');ld()}else alert('error')}async function sb(){let f=bf.files[0];if(!f)return alert('foto');let im=await b64(f);let r=await fetch('/api/banners',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({titulo:bt.value,link:bl.value,imagen:im})});if(r.ok){alert('banner ok');ld()}}async function ld(){try{let a=await(await fetch('/api/productos')).json();let h='';a.slice().reverse().forEach(x=>{h+='<div style=display:flex;gap:8px;border:1px solid #eee;padding:6px;border-radius:8px;margin:4px 0><img src='+((x.fotos&&x.fotos[0])||x.imagen||'')+' style=width:45px;height:45px;object-fit:cover><div style=flex:1><b>'+x.nombre+'</b><br>$'+x.precio+'</div><button style=background:red;color:#fff;padding:5px 8px;border:0;border-radius:5px onclick=dp(&quot;'+(x._id||x.id)+'&quot;)>X</button></div>'});lp.innerHTML=h;let b=await(await fetch('/api/banners')).json();let j='';b.slice().reverse().forEach(y=>{j+='<div style=display:flex;gap:8px;border:1px solid #eee;padding:6px;border-radius:8px;margin:4px 0><img src='+y.imagen+' style=width:45px;height:45px;object-fit:cover><div style=flex:1>'+y.titulo+'</div><button style=background:red;color:#fff;padding:5px 8px;border:0;border-radius:5px onclick=db(&quot;'+(y._id||y.id)+'&quot;)>X</button></div>'});bs.innerHTML=j}catch(e){}}async function dp(i){if(confirm('borrar?')){await fetch('/api/productos/'+i,{method:'DELETE'});ld()}}async function db(i){if(confirm('borrar banner?')){await fetch('/api/banners/'+i,{method:'DELETE'});ld()}}if(localStorage.getItem('a'))ld();</script></body></html>
