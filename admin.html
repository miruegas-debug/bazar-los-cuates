<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Admin Bazar</title><style>body{font-family:Arial;padding:15px;background:#f9f9f9}.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:15px}input,textarea{width:100%;padding:10px;margin:5px 0}button{background:#e52e71;color:#fff;padding:10px;border:none;border-radius:5px}</style></head><body><h1>Admin Bazar - EL BUENO</h1><div class="card"><h2>Banner Inteligente</h2><input id="b_titulo" placeholder="Titulo"><input id="b_link" placeholder="Link"><input type="file" multiple id="b_imagen"><button onclick="subirBanner()">Subir Banner</button><div id="lista-banners"></div></div><div class="card"><h2>Producto N Fotos + Video</h2><input id="p_nombre" placeholder="Nombre"><input id="p_precio" placeholder="Precio"><textarea id="p_desc" placeholder="Desc"></textarea><label style="font-weight:900;display:block;margin-top:10px">📸 FOTOS PRODUCTO (N fotos, 1ra = portada):</label><input id="prod-fotos" type="file" multiple accept="image/*" style="width:100%;padding:10px;background:#facc15;margin:5px 0"><div id="prev-fotos" style="display:flex;gap:5px;overflow:auto"></div><label style="font-weight:900;display:block">🎥 VIDEO (va al final):</label><input id="prod-video" type="file" accept="video/*" style="width:100%;padding:10px;background:#000;color:#fff;margin:5px 0"><div id="prev-video"></div><input id="p_whats" value="4491883244"><label>Fotos hasta 10:</label><input type="file" multiple id="p_fotos" multiple accept="image/*"><label>Video:</label><input type="file" multiple id="p_video" accept="video/*"><button onclick="subirProducto()">Subir Producto</button><div id="msg"></div></div><script>async function cargarBanners(){const r=await fetch('/api/banners');const d=await r.json();document.getElementById('lista-banners').innerHTML=d.map(b=>`<div><img src="${b.imagen}" style="width:100px;height:60px;object-fit:cover"> ${b.titulo} <button onclick="borrarBanner('${b.id}')">Borrar</button></div>`).join('');}async function subirBanner(){const fd=new FormData();fd.append('titulo',document.getElementById('b_titulo').value);fd.append('link',document.getElementById('b_link').value);const f=document.getElementById('b_imagen').files[0];if(f)fd.append('imagen',f);await fetch('/api/banners',{method:'POST',body:fd});alert('Banner ok');cargarBanners();}async function borrarBanner(id){await fetch('/api/banners/'+id,{method:'DELETE'});cargarBanners();}async function subirProducto(){const fd=new FormData();fd.append('nombre',document.getElementById('p_nombre').value);fd.append('precio',document.getElementById('p_precio').value);fd.append('desc',document.getElementById('p_desc').value);fd.append('whatsapp',document.getElementById('p_whats').value);const fotos=document.getElementById('p_fotos').files;for(let i=0;i<fotos.length;i++)fd.append('fotos',fotos[i]);const vid=document.getElementById('p_video').files[0];if(vid)fd.append('video',vid);document.getElementById('msg').innerText='Subiendo...';await fetch('/api/productos',{method:'POST',body:fd});document.getElementById('msg').innerText='Producto subido';}cargarBanners();</script></body></html>
