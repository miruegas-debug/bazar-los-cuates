<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bazar Los Cuates - Jesus Maria</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#faf9f6;color:#222}
header{padding:16px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.05);position:sticky;top:0;z-index:10}
.wrap{max-width:1100px;margin:20px auto;padding:0 16px}
.banner-wrap{position:relative;overflow:hidden;border-radius:18px;background:#111;height:180px;margin-bottom:22px}
.banner-track{display:flex;transition:transform .6s ease;height:100%}
.banner-slide{min-width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center;background:#222}
.banner-slide img{width:100%;height:100%;object-fit:cover;opacity:.9}
.banner-slide .txt{position:absolute;bottom:12px;left:16px;background:rgba(0,0,0,.6);color:#fff;padding:6px 12px;border-radius:999px;font-size:13px}
.banner-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:linear-gradient(90deg,#111,#333)}
.banner-empty b{font-size:22px;letter-spacing:.5px}
.banner-empty small{opacity:.7;margin-top:6px}
.dots{position:absolute;bottom:10px;right:16px;display:flex;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4)}
.dot.active{background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.card img{width:100%;height:220px;object-fit:cover;background:#eee}
.card .info{padding:14px}
.price{font-weight:800;font-size:20px;margin:8px 0}
.btn{display:inline-block;background:#25D366;color:#fff;padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:700;margin-top:8px}
</style>
</head>
<body>
<header><div style="display:flex;justify-content:space-between;align-items:center"><div><h1 style="font-size:20px">Bazar Los Cuates</h1><small>Jesus Maria, Ags - Av. Constitucion 216</small></div><a href="/admin.html" style="font-size:13px;color:#666">Admin</a></div></header>
<div class="wrap">
<div class="banner-wrap" id="bannerWrap">
<div class="banner-track" id="track"></div>
<div class="dots" id="dots"></div>
</div>
<h2 style="margin-bottom:12px">Catalogo</h2>
<div id="grid" class="grid">Cargando...</div>
</div>
<script>
let banners=[], idx=0, timer=null;
async function loadBanners(){
  try{
    let r=await fetch('/api/banners'); banners=await r.json();
    let track=document.getElementById('track');
    let dots=document.getElementById('dots');
    if(!banners || !banners.length){
      track.innerHTML=`<div class="banner-slide"><div class="banner-empty"><b>ANUNCIATE AQUI</b><small>Contacta al Bazar - Espacio disponible</small></div></div>`;
      dots.innerHTML=''; return;
    }
    track.innerHTML=banners.map(b=>`<a class="banner-slide" href="${b.link||'#'}" ${b.link?'target=_blank':''}><img src="${b.imagen}" onerror="this.src='https://via.placeholder.com/800x300?text=Banner'"><span class="txt">${b.titulo||''}</span></a>`).join('');
    dots.innerHTML=banners.map((_,i)=>`<div class="dot ${i==0?'active':''}" id="d${i}"></div>`).join('');
    startSlider();
  }catch(e){
    document.getElementById('track').innerHTML=`<div class="banner-slide"><div class="banner-empty"><b>ANUNCIATE AQUI</b><small>Contacta al Bazar</small></div></div>`;
  }
}
function startSlider(){
  if(timer) clearInterval(timer);
  if(banners.length<=1) return;
  timer=setInterval(()=>{
    idx=(idx+1)%banners.length;
    document.getElementById('track').style.transform=`translateX(-${idx*100}%)`;
    document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i==idx));
  },3000);
}
async function loadProds(){
  try{
    let res=await fetch('/api/productos'); let prods=await res.json();
    let grid=document.getElementById('grid');
    if(!prods.length){grid.innerHTML='<p style=color:#888>Aun no hay piezas. Sube una en Admin</p>';return;}
    grid.innerHTML=prods.slice().reverse().map(p=>`
      <div class="card">
        <img src="${(p.fotos&&p.fotos[0])||p.imagen||p.foto||'https://via.placeholder.com/400x300?text=Sin+Foto'}" onerror="this.src='https://via.placeholder.com/400x300?text=Sin+Foto'">
        <div class="info">
          <div class="price">$${p.precio||0}</div>
          <div style="font-weight:700">${p.nombre||'Producto'}</div>
          <p style="font-size:13px;color:#555">${p.desc||p.descripcion||''}</p>
          <a class="btn" target="_blank" href="https://wa.me/524491883244?text=Hola me interesa ${encodeURIComponent(p.nombre||'producto')}">WhatsApp</a>
        </div>
      </div>
    `).join('');
  }catch(e){document.getElementById('grid').innerHTML='Error cargando productos';}
}
loadBanners(); loadProds();
</script>
</body>
</html>
